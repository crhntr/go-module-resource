resource_types:
  - name: go-module
    type: registry-image
    source:
      repository: ghcr.io/crhntr/go-module-resource
      tag: latest
      username: crhntr
      password: ((github-pat))

resources:
  - name: source
    type: git
    source:
      uri: git@github.com:crhntr/txtarfmt.git
      branch: main
      private_key: ((ci_key))

  - name: go-image
    type: registry-image
    icon: docker
    source:
      repository: golang
      tag: 1.27

  - name: dependency-tools
    type: go-module
    check_every: 24h
    source:
      module: golang.org/x/tools

jobs:
  - name: bump-tools
    plan:
      - in_parallel:
          fail_fast: true
          steps:
            - get: dependency
              resource: dependency-tools
              trigger: true
            - get: go-image
            - get: source
      - task: go-get
        image: go-image
        config:
          platform: linux
          inputs:
            - name: source
            - name: dependency
          run:
            path: ../dependency/go-get.sh
            dir: source
      - task: go-test
        image: go-image
        config:
          platform: linux
          inputs:
            - name: source
          run:
            path: /usr/bin/bash
            dir: source
            args:
              - -c
              - |
                set -euxo pipefail
                go mod download
                go test ./...
